name: CI/CD Pipeline - DKIM Service (Scaleway Container Registry -> Scaleway VM)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}

jobs:
  # ============================================================
  # JOB 1 : Test - Lint & check Node.js 22
  # ============================================================
  test:
    name: Lint & Test
    runs-on: [self-hosted, linux, x64, scw-rust-large]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check syntax
        run: node --check app.js

  # ============================================================
  # JOB 2 : Build & Push DKIM image via Docker Buildx to SCW Registry
  # ============================================================
  build-push-dkim:
    name: Build & Push DKIM image (SCW Registry)
    needs: test
    runs-on: [self-hosted, linux, x64, scw-rust-large]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SCW_REGISTRY_ENDPOINT }}
          # Scaleway registry supports secret-key auth with static username
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build & push DKIM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.SCW_REGISTRY_ENDPOINT }}/dkim-service:latest
            ${{ env.SCW_REGISTRY_ENDPOINT }}/dkim-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # JOB 3 : Trigger deployment workflow on reimagined-guide
  #         via repository_dispatch
  # ============================================================
  trigger-deploy:
    name: Trigger deployment on reimagined-guide
    needs: build-push-dkim
    runs-on: [self-hosted, linux, x64, scw-rust-large]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger repository_dispatch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEPLOY_REPO: ${{ secrets.DEPLOY_REPO }}
          SCW_REGISTRY_ENDPOINT: ${{ secrets.SCW_REGISTRY_ENDPOINT }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PAT:-}" ] || [ -z "${DEPLOY_REPO:-}" ]; then
            echo "GH_PAT or DEPLOY_REPO secret is missing"
            exit 1
          fi

          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_PAT}" \
            https://api.github.com/repos/${DEPLOY_REPO}/dispatches \
            -d '{"event_type":"deploy","client_payload":{"source":"studious-octo-rotary-phone","sha":"${{ github.sha }}","image":"'"${SCW_REGISTRY_ENDPOINT}"'/dkim-service:latest","tag":"latest"}}'
          echo "Deployment triggered on ${DEPLOY_REPO} for image ${SCW_REGISTRY_ENDPOINT}/dkim-service:latest"
