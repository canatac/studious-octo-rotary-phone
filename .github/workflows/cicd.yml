name: CI/CD Pipeline - DKIM Service (Azure ACR -> Scaleway VM)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}

jobs:
  # ============================================================
  # JOB 1 : Test - Lint & check Node.js 22
  # ============================================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check syntax
        run: node --check app.js

  # ============================================================
  # JOB 2 : Build & Push DKIM image via az acr build
  # ============================================================
  build-push-dkim:
    name: Build & Push DKIM image (az acr build)
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push DKIM image (remote ACR build, no local Docker)
        run: |
          set -euo pipefail
          az acr build \
            --image dkim-service:latest \
            --image dkim-service:${{ github.sha }} \
            --registry ${{ env.ACR_NAME }} \
            --file Dockerfile \
            .

  # ============================================================
  # JOB 3 : Trigger deployment workflow on reimagined-guide
  #         via repository_dispatch
  # ============================================================
  trigger-deploy:
    name: Trigger deployment on reimagined-guide
    needs: build-push-dkim
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Trigger repository_dispatch
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            https://api.github.com/repos/${{ secrets.DEPLOY_REPO }}/dispatches \
            -d '{"event_type": "deploy", "client_payload": {"source": "studious-octo-rotary-phone", "sha": "${{ github.sha }}"}}'
          echo "Deployment triggered on ${{ secrets.DEPLOY_REPO }}"
